name: One-time cleanup
run-name: "Cleanup old pages and Actions history"
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cleanup-once.yml']
permissions:
  contents: read
concurrency:
  group: html-pages
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          ref: published-pages
          persist-credentials: false
      - name: Verify only empty publication scaffold remains
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          assert json.loads(Path("registry.json").read_text()) == {}
          assert sorted(str(p) for p in Path("site").rglob("*") if p.is_file()) == ["site/index.html"]
          PY
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Replace old pages with empty publication
        uses: actions/deploy-pages@v4
      - name: Delete previous Actions runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          from urllib.error import HTTPError
          repo = os.environ["GH_REPO"]
          current = int(os.environ["GITHUB_RUN_ID"])
          original = [42784455512,42784303729,42784213267,42784035486,42783911113,42783723362,42783430502,42782097115,42780622040,42780470203]
          def api(path, method="GET"):
              req = urllib.request.Request("https://api.github.com/repos/" + repo + path, method=method,
                  headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json",
                           "X-GitHub-Api-Version": "2022-11-28"})
              with urllib.request.urlopen(req, timeout=30) as response:
                  data = response.read()
                  return json.loads(data) if data else None
          for run_id in original:
              try:
                  api(f"/actions/runs/{run_id}", "DELETE")
                  print(f"Deleted original run {run_id}")
              except HTTPError as exc:
                  if exc.code != 404:
                      raise
          # The push also starts the menu refresher; delete only that same-commit housekeeping run.
          for attempt in range(36):
              runs = api("/actions/runs?per_page=100")["workflow_runs"]
              helpers = [r for r in runs if r["id"] != current and r["head_sha"] == os.environ["GITHUB_SHA"]
                         and r["path"] == ".github/workflows/refresh-html-menu.yml"]
              if all(r["status"] == "completed" for r in helpers):
                  for r in helpers:
                      api(f'/actions/runs/{r["id"]}', "DELETE")
                      print(f'Deleted helper run {r["id"]}')
                  break
              time.sleep(5)
          else:
              raise RuntimeError("Menu refresher still running; no unrelated runs were deleted")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("## 정리 완료\n\n기존 실행 기록 10개와 게시된 페이지 사본을 삭제했습니다. HTML 원본(main/public)은 보존했습니다.\n\n이 정리 실행 기록만 Actions 목록에서 삭제하면 됩니다.\n")
          PY
