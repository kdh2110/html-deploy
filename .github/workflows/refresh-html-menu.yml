name: Refresh HTML menu
on:
  push:
    paths:
      - 'public/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
permissions:
  contents: read
concurrency:
  group: html-menu
  cancel-in-progress: false
jobs:
  menu:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify selected-page behavior
        run: python3 -m unittest discover -s tests -v
      - name: Refresh dropdown only (no page deployment)
        env:
          MENU_SYNC_TOKEN: ${{ secrets.MENU_SYNC_TOKEN }}
        run: python3 scripts/sync_choices.py --remote
