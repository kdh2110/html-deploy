name: Publish HTML pages
run-name: "HTML 배포 · ${{ inputs.page || '전체 페이지' }}"

on:
  push:
    paths:
      - 'public/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/publish-html.yml'
  workflow_dispatch:
    inputs:
      page:
        description: '결과 화면 맨 위에 표시할 HTML (전체 페이지는 함께 유지됩니다)'
        required: true
        type: choice
        default: '전체 페이지'
        options:
          # BEGIN HTML CHOICES
          - "전체 페이지"
          - "test1.html"
          # END HTML CHOICES

permissions:
  contents: read

concurrency:
  group: html-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify page builder
        run: python3 -m unittest discover -s tests -v
      - uses: actions/configure-pages@v5
      - name: Build all saved pages
        env:
          SELECTED_PAGE: ${{ inputs.page }}
        run: python3 scripts/build_pages.py build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/upload-artifact@v4
        with:
          name: page-metadata
          path: page-metadata/pages.json
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: page-metadata
          path: page-metadata
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Show selected page and all links
        env:
          SELECTED_PAGE: ${{ inputs.page }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python3 scripts/build_pages.py summary

  sync-menu:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Refresh Run workflow choices
        env:
          MENU_SYNC_TOKEN: ${{ secrets.MENU_SYNC_TOKEN }}
        run: python3 scripts/sync_choices.py --remote
